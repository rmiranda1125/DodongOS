{% extends "base.html" %}

{% block title %}
Add Activity
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2>Add Activity</h2>

        <p class="text-muted">
            {{ lead.company_name }}
        </p>

    </div>

    <a
        href="{% url 'leads:detail' lead.pk %}"
        class="btn btn-outline-secondary"
    >
        Cancel
    </a>

</div>


<div class="card">

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            {% for field in form %}

                <div class="mb-3">

                    <label class="form-label">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.errors %}

                        <div class="text-danger small">
                            {{ field.errors }}
                        </div>

                    {% endif %}

                </div>

            {% endfor %}


            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Activity
                </button>

                <a
                    href="{% url 'leads:detail' lead.pk %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
