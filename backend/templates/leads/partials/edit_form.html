<div class="modal-header">

    <h5 class="modal-title">
        Edit Lead
    </h5>

    <button
        type="button"
        class="btn-close"
        data-bs-dismiss="modal"
    ></button>

</div>


<form
    method="POST"

    hx-post="{% url 'leads:edit' lead.pk %}"

    hx-target="#modal-content"

    hx-swap="innerHTML"
>

    {% csrf_token %}

    <div class="modal-body">

        {% for field in form %}

            <div class="mb-3">

                <label class="form-label">
                    {{ field.label }}
                </label>

                {{ field }}

                {% if field.errors %}

                    <div class="text-danger small">
                        {{ field.errors }}
                    </div>

                {% endif %}

            </div>

        {% endfor %}

    </div>


    <div class="modal-footer">

        <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
        >
            Cancel
        </button>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Changes
        </button>

    </div>

</form>
