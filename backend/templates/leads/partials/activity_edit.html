<div class="p-4">

    <!-- ================================================= -->
    <!-- HEADER -->
    <!-- ================================================= -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h5 class="mb-0">
            Edit Activity
        </h5>

        <button
            type="button"
            class="btn-close"
            aria-label="Close"
            onclick="closeDodongModal()"
        ></button>

    </div>


    <!-- ================================================= -->
    <!-- FORM -->
    <!-- ================================================= -->

    <form
        id="activity-edit-form"
        method="POST"
        hx-post="{% url 'leads:edit_activity' lead.pk activity.pk %}"
        hx-target="#activity-timeline"
        hx-swap="outerHTML"
    >

        {% csrf_token %}


        <!-- ================================================= -->
        <!-- ACTIVITY TYPE -->
        <!-- ================================================= -->

        <div class="mb-3">

            <label
                for="activity_type"
                class="form-label"
            >
                Activity Type
            </label>

            <select
                id="activity_type"
                name="activity_type"
                class="form-select"
                required
            >

                {% for value, label in activity_types %}

                    <option
                        value="{{ value }}"
                        {% if activity.activity_type == value %}
                            selected
                        {% endif %}
                    >
                        {{ label }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- ================================================= -->
        <!-- DESCRIPTION -->
        <!-- ================================================= -->

        <div class="mb-4">

            <label
                for="description"
                class="form-label"
            >
                Description
            </label>

            <textarea
                id="description"
                name="description"
                class="form-control"
                rows="5"
            >{{ activity.description }}</textarea>

        </div>


        <!-- ================================================= -->
        <!-- BUTTONS -->
        <!-- ================================================= -->

        <div class="d-flex justify-content-end gap-2">

            <button
                type="button"
                class="btn btn-secondary"
                onclick="closeDodongModal()"
            >
                Cancel
            </button>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

        </div>

    </form>

</div>

document.getElementById("mainModal")
