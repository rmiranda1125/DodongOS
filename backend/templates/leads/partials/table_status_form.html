<form
    method="POST"

    hx-post="{% url 'leads:update_lead_status' lead.pk %}"

    hx-target="#lead-status-{{ lead.pk }}"

    hx-swap="innerHTML"

    class="d-flex gap-1"
>

    {% csrf_token %}

    <select
        name="status"
        class="form-select form-select-sm"
    >

        {% for value, label in lead.STATUS_CHOICES %}

            <option
                value="{{ value }}"
                {% if lead.status == value %}
                    selected
                {% endif %}
            >
                {{ label }}
            </option>

        {% endfor %}

    </select>

    <button
        type="submit"
        class="btn btn-sm btn-primary"
    >
        Save
    </button>

</form>
