<div class="modal-header">

    <h5 class="modal-title">
        Add Activity
    </h5>

    <button
        type="button"
        class="btn-close"
        data-bs-dismiss="modal"
        aria-label="Close"
    ></button>

</div>


<form
    hx-post="{% url 'leads:add_activity' lead.pk %}"
    hx-target="#activity-timeline"
    hx-swap="outerHTML"
>

    {% csrf_token %}

    <div class="modal-body">

        <div class="mb-3">

            <label
                for="id_activity_type"
                class="form-label"
            >
                Activity Type
            </label>

            <select
                id="id_activity_type"
                name="activity_type"
                class="form-select"
                required
            >

                <option value="">
                    Select activity
                </option>

                {% for value, label in activity_types %}

                    <option value="{{ value }}">
                        {{ label }}
                    </option>

                {% endfor %}

            </select>

            {% if form.activity_type.errors %}

                <div class="text-danger small mt-1">
                    {{ form.activity_type.errors }}
                </div>

            {% endif %}

        </div>


        <div class="mb-3">

            <label
                for="id_description"
                class="form-label"
            >
                Description
            </label>

            <textarea
                id="id_description"
                name="description"
                class="form-control"
                rows="4"
                placeholder="What happened?"
            ></textarea>

            {% if form.description.errors %}

                <div class="text-danger small mt-1">
                    {{ form.description.errors }}
                </div>

            {% endif %}

        </div>

    </div>


    <div class="modal-footer">

        <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
        >
            Cancel
        </button>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Add Activity
        </button>

    </div>

</form>
