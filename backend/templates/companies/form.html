{% extends "base.html" %}

{% block title %}
Add Company
{% endblock %}

{% block content %}

<div class="container">

    <h2>Add Company</h2>

    <form
        {% if form.instance.pk %}
            hx-post="{% url 'companies:edit' form.instance.pk %}"
        {% else %}
            hx-post="{% url 'companies:create' %}"
        {% endif %}
        hx-target="#company-table"
        hx-swap="outerHTML">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-primary">

            Save Company

        </button>

    </form>

</div>

{% endblock %}
