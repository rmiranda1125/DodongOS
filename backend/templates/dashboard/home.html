{% extends "base.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<h2>Dashboard</h2>

<p>Welcome to Dodong OS 🚀</p>

<div class="row">

    <div class="col-md-3">

        <div class="card">

            <div class="card-body">

                <h5>Companies</h5>

                <h2>0</h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card">

            <div class="card-body">

                <h5>Contacts</h5>

                <h2>0</h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card">

            <div class="card-body">

                <h5>Leads</h5>

                <h2>0</h2>

            </div>

        </div>

    </div>

</div>

<hr>

<h3>HTMX Playground</h3>

<button
    class="btn btn-success"
    hx-get="{% url 'hello_htmx' %}"
    hx-target="#result"
    hx-swap="innerHTML">

    Click Me

</button>

<div id="result" class="mt-3"></div>

<hr>

<h3>Live Server Clock</h3>

<div
    hx-get="{% url 'server_time' %}"
    hx-trigger="load, every 5s"
    hx-target="this"
    hx-swap="innerHTML">

    Loading server time...

</div>

{% endblock %}
