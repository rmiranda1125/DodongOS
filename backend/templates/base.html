{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Dodong OS
        {% endblock %}
    </title>


    <!-- ================================================= -->
    <!-- BOOTSTRAP CSS -->
    <!-- ================================================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- ================================================= -->
    <!-- HTMX -->
    <!-- ================================================= -->

    <script
        src="https://unpkg.com/htmx.org@2.0.6"
    ></script>


    <!-- ================================================= -->
    <!-- CUSTOM CSS -->
    <!-- ================================================= -->

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >


    <!-- ================================================= -->
    <!-- CSRF -->
    <!-- ================================================= -->

    <meta
        name="csrf-token"
        content="{{ csrf_token }}"
    >

</head>


<body>

    <!-- ================================================= -->
    <!-- NAVBAR -->
    <!-- ================================================= -->

    {% include "partials/navbar.html" %}


    <!-- ================================================= -->
    <!-- MAIN LAYOUT -->
    <!-- ================================================= -->

    <div class="row">

        <!-- SIDEBAR -->

        <div class="col-md-2 p-0">

            {% include "partials/sidebar.html" %}

        </div>


        <!-- MAIN CONTENT -->

        <div class="col-md-10 p-4">

            {% block content %}
            {% endblock %}

        </div>

    </div>


    <!-- ================================================= -->
    <!-- DODONG OS CUSTOM MODAL -->
    <!-- ================================================= -->

    {% include "components/modal.html" %}


    <!-- ================================================= -->
    <!-- PAGE-SPECIFIC JAVASCRIPT -->
    <!-- ================================================= -->

    {% block extra_js %}
    {% endblock %}


    <!-- ================================================= -->
    <!-- BOOTSTRAP JS -->
    <!-- ================================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- ================================================= -->
    <!-- DODONG OS JS -->
    <!-- ================================================= -->

    <script
        src="{% static 'js/dodong.js' %}"
    ></script>

</body>

</html>
