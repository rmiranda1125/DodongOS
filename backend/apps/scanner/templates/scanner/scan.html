<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dodong OS - Scanner</title>
</head>
<body>

<h1>Lead Scanner</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Scan with GPT-5.6 Luna</button>
</form>

{% if result %}
    <hr>
    <h2>Result</h2>
    <pre>{{ result }}</pre>
{% endif %}

{% if error %}
    <hr>
    <h2>Error</h2>
    <pre>{{ error }}</pre>
{% endif %}

</body>
</html>
