name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # No repository secrets are required to run this suite. External
    # AI providers are mocked in tests; a throwaway key/host is
    # supplied here only so settings load.
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SKIP_DOTENV: "1"
      DJANGO_ENV: development
      SECRET_KEY: ci-insecure-test-key-not-for-production
      DEBUG: "False"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 1

      - name: Deploy check (production-like)
        env:
          DJANGO_ENV: production
          SECRET_KEY: ci-deploy-check-key-not-for-production-000000
          ALLOWED_HOSTS: ci.example.com
          CSRF_TRUSTED_ORIGINS: https://ci.example.com
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: python manage.py check --deploy

  postgres-smoke:
    runs-on: ubuntu-latest
    # Optional: runs the suite against a real PostgreSQL service so
    # engine-specific behaviour (select_for_update, jsonb, ordering)
    # is exercised. Uses an isolated CI database - never production
    # credentials.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dodong
          POSTGRES_PASSWORD: dodong
          POSTGRES_DB: dodong_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dodong"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SKIP_DOTENV: "1"
      DJANGO_ENV: development
      SECRET_KEY: ci-insecure-test-key-not-for-production
      DEBUG: "False"
      DATABASE_URL: postgres://dodong:dodong@localhost:5432/dodong_ci

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrate against PostgreSQL
        run: python manage.py migrate
      - name: Run tests against PostgreSQL
        run: python manage.py test --verbosity 1
